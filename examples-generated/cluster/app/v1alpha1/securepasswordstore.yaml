apiVersion: app.okta.upbound.io/v1alpha1
kind: SecurePasswordStore
metadata:
  annotations:
    meta.upbound.io/example-id: app/v1alpha1/securepasswordstore
  labels:
    testing.upbound.io/example-name: example
  name: example
spec:
  forProvider:
    credentialsScheme: ADMIN_SETS_CREDENTIALS
    label: example
    passwordField: pass
    url: https://test.com
    usernameField: user
