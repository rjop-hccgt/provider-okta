apiVersion: app.okta.m.upbound.io/v1alpha1
kind: ThreeField
metadata:
  annotations:
    meta.upbound.io/example-id: app/v1alpha1/threefield
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    credentialsScheme: EDIT_USERNAME_AND_PASSWORD
