apiVersion: auth.okta.m.upbound.io/v1alpha1
kind: ServerClaimDefault
metadata:
  annotations:
    meta.upbound.io/example-id: auth/v1alpha1/serverclaimdefault
  labels:
    testing.upbound.io/example-name: example
  name: example
  namespace: crossplane-system
spec:
  forProvider:
    authServerIdSelector:
      matchLabels:
        testing.upbound.io/example-name: example
    name: sub
    value: '(appuser != null) ? appuser.userName : app.clientId'
